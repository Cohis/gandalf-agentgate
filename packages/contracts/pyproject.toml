[project]
name = "gandalf-contracts"
version = "0.1.0"
description = "API contracts shared by the engine, the shop and the offline jobs."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.14,<3", "cryptography>=44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gandalf_contracts"]
