[project]
name = "gandalf-engine"
version = "0.1.0"
description = "Real-time risk engine: POST /avaliar."
requires-python = ">=3.13"
dependencies = [
    "gandalf-contracts",
    "gandalf-features",
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "redis[hiredis]>=8.1,<9",
    "psycopg[binary,pool]>=3.3,<4",
    "pyyaml>=6",
    "lightgbm>=4.7,<5",
    "numpy>=2",
    "cryptography>=44",
    "http-sf>=1.5",
    "httpx>=0.28",
]

[tool.uv.sources]
gandalf-contracts = { workspace = true }
gandalf-features = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gandalf_engine"]
