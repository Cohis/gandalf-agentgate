# Hard rules for the obvious cases. Explainable, and changeable in seconds.
# Honeypot and canary may NEVER appear here: they are model signals only,
# because screen readers also read hidden content (the loader enforces this).

- id: taxa_absurda_ip
  decisao: negar
  motivo: "taxa absurda de requisições a partir do mesmo IP (10 min)"
  todas:
    - { feature: ev_ip_10m, op: ">=", valor: 300 }

- id: taxa_absurda_dispositivo
  decisao: negar
  motivo: "taxa absurda de requisições a partir do mesmo dispositivo (10 min)"
  todas:
    - { feature: ev_disp_10m, op: ">=", valor: 120 }

- id: ip_em_lista_de_bloqueio
  decisao: negar
  motivo: "IP presente em lista pública de redes sequestradas ou botnets"
  todas:
    - { feature: ip_em_lista, op: "==", valor: 1 }

- id: webdriver_declarado
  decisao: desafiar
  motivo: "navegador se declara controlado por automação (navigator.webdriver)"
  todas:
    - { feature: webdriver, op: "==", valor: 1 }
    - { feature: agente_declarado, op: "==", valor: 0 }

- id: fazenda_no_dispositivo
  decisao: desafiar
  motivo: "muitas contas distintas no mesmo dispositivo em 24 h"
  todas:
    - { feature: contas_por_disp_24h, op: ">=", valor: 8 }
