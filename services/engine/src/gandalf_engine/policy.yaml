# Score -> decision. Phase 1 thresholds are placeholders; from phase 3 on they are
# chosen by minimising  custo_fn * FN + custo_fp * FP  on the validation period.
versao: "p2"  # p2: automation and fraud scores crossed
ator:
  limiar_automacao: 0.5   # above this the actor is classified as undeclared automation
decisao:
  desafiar_acima_de: 0.6
  negar_acima_de: 0.97    # deny only when nearly certain; a challenge is the cheaper mistake
custos:                   # used by the offline threshold search
  custo_fn: 20.0          # fraud that got through
  custo_fp: 5.0           # good customer blocked
  custo_desafio: 0.5      # friction of a passkey prompt or an out-of-session confirmation
  desafio_barra: 0.8      # share of fraud a challenge stops (a stolen password does not
                          # come with the owner's phone; a card tester may own the account)
  prevalencia_fraude: 0.02 # share of real traffic that is fraud. The lab has far more
                          # attacks than customers; costs are reweighted to this rate,
                          # otherwise challenging everyone looks cheap. An assumption.
  atrito_maximo: 0.05     # a ceiling, not a cost: at most this share of honest events
                          # (validation) may be challenged by the fraud model. By cost
                          # alone the search challenged 14 % of simulated people in phase 7
                          # (21 % of those with a disability) for 11 points of human fraud.
