[project]
name = "gandalf-shop"
version = "0.1.0"
description = "Lab shop that integrates the telemetry script and calls the engine."
requires-python = ">=3.13"
dependencies = [
    "gandalf-contracts",
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "webauthn>=3.0",
]

[tool.uv.sources]
gandalf-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gandalf_shop"]
artifacts = ["src/gandalf_shop/static/telemetry.js"]
