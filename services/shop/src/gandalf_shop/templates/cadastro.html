{% extends "base.html" %}
{% block titulo %}Criar conta · Loja da Montanha{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form class="pilha" method="post" action="/cadastro">
  <label>Nome completo <input type="text" name="nome" autocomplete="name" required></label>
  <label>E-mail <input type="email" name="email" autocomplete="email" required></label>
  <label>Senha (mínimo de 6 caracteres)
    <input type="password" name="senha" autocomplete="new-password" minlength="6" required></label>
  <label>Endereço de entrega <input type="text" name="endereco" autocomplete="street-address"></label>
  <label>Conte um pouco sobre você (opcional) <textarea name="bio" rows="3"></textarea></label>
  {% include "_armadilhas.html" %}
  <button type="submit">Criar conta</button>
</form>
<p>Já tem conta? <a href="/login">Entrar</a></p>
{% endblock %}
