{% extends "base.html" %}
{% block titulo %}{{ p.nome }} · Loja da Montanha{% endblock %}
{% block conteudo %}
<h1>{{ p.nome }}</h1>
<p>R$ {{ "%.2f"|format(p.preco) }} · <span class="muted">{{ p.estoque }} em estoque</span></p>
<p>Feito à mão nas oficinas da Montanha. Envio para todo o Brasil.</p>
<form method="post" action="/carrinho/adicionar">
  <input type="hidden" name="pid" value="{{ pid }}">
  <input type="hidden" name="telemetria" value="">
  <button type="submit">Adicionar ao carrinho</button>
</form>
<p><a href="/">Voltar ao catálogo</a></p>
{% endblock %}
